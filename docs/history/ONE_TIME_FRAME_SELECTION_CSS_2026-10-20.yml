name: Regenerate VAW CSS for selection framing (one-time)
# Self-archives after generating the exact CSS and verifying the camera work.
# Retry after fixing nested assembly-space parent world transforms.
# Retry after moving selected-frame button ownership out of game.js.

on:
  push:
    branches: [recovery/playable-truth]
    paths:
      - .github/workflows/once-frame-selection-css.yml

permissions:
  contents: write

concurrency:
  group: vaw-once-frame-selection-css
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.ref == 'refs/heads/recovery/playable-truth'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate exact CSS and test
        run: |
          npm install --no-save --package-lock=false --ignore-scripts tailwindcss@4.1.10
          node tools/generate_tailwind_css.js
          node tools/generate_tailwind_css.js --check
          node tests/test_camera_controller.js
          node tests/test_workshop_selection.js
          python tests/run_all.py
      - name: Archive one-time CI and commit generated CSS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git mv .github/workflows/once-frame-selection-css.yml docs/history/ONE_TIME_FRAME_SELECTION_CSS_2026-10-20.yml
          git add tailwind.generated.css docs/history/ONE_TIME_FRAME_SELECTION_CSS_2026-10-20.yml
          git commit -m 'build(recovery): regenerate CSS for inspector framing'
          git push origin HEAD:refs/heads/recovery/playable-truth
