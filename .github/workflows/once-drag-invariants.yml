name: VAW one-time adversarial Select drag gate
# Retry after proving both stale-ray and selection-target regressions; now guarded.
on:
  push:
    branches: [recovery/playable-truth]
    paths: [.github/workflows/once-drag-invariants.yml]
permissions:
  contents: write
concurrency:
  group: vaw-one-time-drag-invariants
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/recovery/playable-truth'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify adverse drag scenarios before touching generated CSS
        run: node tests/test_workshop_drag.js
      - name: Generate CSS from exact source and validate full application
        run: |
          npm install --no-save --package-lock=false --ignore-scripts tailwindcss@4.1.10
          node tools/generate_tailwind_css.js
          node tools/generate_tailwind_css.js --check
          python -u tests/run_all.py
      - name: Archive temporary gate and commit generated CSS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git mv .github/workflows/once-drag-invariants.yml docs/history/ONE_TIME_DRAG_INVARIANTS_2026-10-20.yml
          git add tailwind.generated.css docs/history/ONE_TIME_DRAG_INVARIANTS_2026-10-20.yml
          git commit -m 'build(recovery): validate drag identity and stale-ray invariants'
          git push origin HEAD:refs/heads/recovery/playable-truth
