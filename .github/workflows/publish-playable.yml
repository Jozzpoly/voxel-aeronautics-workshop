name: Publish playable VAW recovery
# Release gate: verified empty-craft manual placement and compact first-visit experience (2026-10-19).
# Release gate: one-click Select / Inspect via V, followed by source and release Chromium PASS.
# Intentionally manual: update this workflow to publish a new verified revision.
# 2026-10-20 release gate: browser-verified conflict protection and non-destructive rescue JSON export.
# 2026-10-20 release gate: selected-part world-space FRAME, pilot focus clarity, real Chromium PASS.

on:
  push:
    branches: [recovery/playable-truth]
    paths:
      - .github/workflows/publish-playable.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vaw-playable-publish
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/recovery/playable-truth'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact recovery revision
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate and create reproducible single-file game
        run: |
          python tests/run_all.py
          python tools/build_release.py
          python tools/verify_release.py

      - name: Stage playable build and relative visual assets
        run: |
          mkdir -p "$RUNNER_TEMP/vaw-playable/assets"
          cp dist/Voxel_Aeronautics_Workshop_Workbench_Foundation.html "$RUNNER_TEMP/vaw-playable/index.html"
          cp -R assets/. "$RUNNER_TEMP/vaw-playable/assets/"
          touch "$RUNNER_TEMP/vaw-playable/.nojekyll"
          printf '{"sourceBranch":"recovery/playable-truth","sourceCommit":"%s","kind":"reproducible-single-file-with-visual-assets"}\n' "$GITHUB_SHA" > "$RUNNER_TEMP/vaw-playable/BUILD_INFO.json"

      - name: Publish to separate gh-pages branch without modifying main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          live_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/recovery/playable-truth" --jq '.object.sha')
          if [[ "$live_head" != "$GITHUB_SHA" ]]; then
            echo "::error::Recovery advanced since checkout; refusing to publish outdated game."
            exit 1
          fi
          gh auth setup-git
          site="$RUNNER_TEMP/vaw-site"
          mkdir -p "$site"
          git -C "$site" init -b gh-pages
          git -C "$site" config user.name 'github-actions[bot]'
          git -C "$site" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$site" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git -C "$site" ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git -C "$site" fetch --depth=1 origin gh-pages
            git -C "$site" switch -C gh-pages FETCH_HEAD
          fi
          cp -R "$RUNNER_TEMP/vaw-playable/." "$site/"
          git -C "$site" add -A
          if git -C "$site" diff --cached --quiet; then
            echo 'Identical build already published.'
          else
            git -C "$site" commit -m "playable: recovery $GITHUB_SHA"
            git -C "$site" push origin HEAD:refs/heads/gh-pages
          fi
          published=$(gh api "repos/$GITHUB_REPOSITORY/contents/BUILD_INFO.json?ref=gh-pages" --jq '.content' | tr -d '\n' | base64 -d)
          echo "$published"
          echo "$published" | grep -F "$GITHUB_SHA" >/dev/null
          echo 'Published and verified gh-pages content.'

      - name: Upload tested single-file as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaw-playable-${{ github.sha }}
          path: |
            dist/Voxel_Aeronautics_Workshop_Workbench_Foundation.html
            dist/SOURCE_MANIFEST.json
            dist/SHA256.txt
          retention-days: 30
