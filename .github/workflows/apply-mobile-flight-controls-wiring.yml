name: Apply Mobile Flight Controls Wiring

on:
  push:
    branches:
      - mobile/playable-mvp
  pull_request:
    branches:
      - VAW_GRoK

permissions:
  contents: write

concurrency:
  group: apply-mobile-flight-controls-wiring
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[flight wiring applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/playable-mvp

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply flight controls wiring
        run: python tools/apply_mobile_flight_controls_wiring.py

      - name: Validate flight controls wiring
        run: |
          node --check src/game/mobile-flight-controls.js
          node --check src/foundation/bootstrap.js
          node tests/test_mobile_command_port.js
          node tests/test_mobile_flight_controls.js
          python tests/test_mobile_release_wiring.py

      - name: Remove one-time wiring machinery
        run: |
          rm tools/apply_mobile_flight_controls_wiring.py
          rm .github/workflows/apply-mobile-flight-controls-wiring.yml

      - name: Commit flight controls wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build_release.py tests/test_mobile_release_wiring.py tests/run_all.py .github/workflows/mobile-playable-mvp-validation.yml tools/apply_mobile_flight_controls_wiring.py .github/workflows/apply-mobile-flight-controls-wiring.yml
          git commit -m "Wire dedicated mobile flight controls [flight wiring applied]"
          git push origin HEAD:mobile/playable-mvp
