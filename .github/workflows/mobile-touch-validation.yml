name: Mobile Touch Validation

on:
  push:
    branches:
      - mobile/playable-mvp
      - mobile/compatibility-validation
  pull_request:
    branches:
      - mobile/playable-mvp
      - VAW_GRoK
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-touch-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MOBILE_VALIDATION_ARTIFACT_DIR: /tmp/vaw-mobile-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record environment
        run: |
          mkdir -p "$MOBILE_VALIDATION_ARTIFACT_DIR/logs"
          python --version | tee "$MOBILE_VALIDATION_ARTIFACT_DIR/logs/environment.txt"
          node --version | tee -a "$MOBILE_VALIDATION_ARTIFACT_DIR/logs/environment.txt"
          git rev-parse HEAD | tee -a "$MOBILE_VALIDATION_ARTIFACT_DIR/logs/environment.txt"
          git status --short --branch | tee -a "$MOBILE_VALIDATION_ARTIFACT_DIR/logs/environment.txt"

      - name: Compile Python sources
        run: |
          set -o pipefail
          python -m compileall . 2>&1 | tee "$MOBILE_VALIDATION_ARTIFACT_DIR/logs/compileall.log"

      - name: Run full core suite
        run: |
          set -o pipefail
          python -u tests/run_all.py 2>&1 | tee "$MOBILE_VALIDATION_ARTIFACT_DIR/logs/run_all.log"

      - name: Build release artifacts
        run: |
          set -o pipefail
          python tools/build_release.py 2>&1 | tee "$MOBILE_VALIDATION_ARTIFACT_DIR/logs/build_release.log"

      - name: Verify release artifacts
        run: |
          set -o pipefail
          python tools/verify_release.py 2>&1 | tee "$MOBILE_VALIDATION_ARTIFACT_DIR/logs/verify_release.log"

      - name: Run desktop browser smoke
        run: |
          combined="$MOBILE_VALIDATION_ARTIFACT_DIR/logs/browser_smoke_desktop.log"
          : > "$combined"
          for attempt in 1 2 3; do
            attempt_log="$MOBILE_VALIDATION_ARTIFACT_DIR/logs/browser_smoke_desktop_attempt_${attempt}.log"
            set +e
            npm run browser:smoke 2>&1 | tee "$attempt_log"
            code=${PIPESTATUS[0]}
            set -e
            {
              echo "=== desktop smoke attempt ${attempt}, exit ${code} ==="
              cat "$attempt_log"
            } >> "$combined"
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if [ "$code" -ne 2 ]; then
              exit "$code"
            fi
            echo "Desktop smoke reported an environment failure; retrying." | tee -a "$combined"
            sleep $((attempt * 2))
          done
          exit 2

      - name: Run mobile touch browser smoke
        run: |
          combined="$MOBILE_VALIDATION_ARTIFACT_DIR/logs/browser_smoke_mobile.log"
          : > "$combined"
          for attempt in 1 2 3; do
            attempt_log="$MOBILE_VALIDATION_ARTIFACT_DIR/logs/browser_smoke_mobile_attempt_${attempt}.log"
            set +e
            npm run browser:smoke:mobile 2>&1 | tee "$attempt_log"
            code=${PIPESTATUS[0]}
            set -e
            {
              echo "=== mobile smoke attempt ${attempt}, exit ${code} ==="
              cat "$attempt_log"
            } >> "$combined"
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if [ "$code" -ne 2 ]; then
              exit "$code"
            fi
            echo "Mobile smoke reported an environment failure; retrying." | tee -a "$combined"
            sleep $((attempt * 2))
          done
          exit 2

      - name: Run no-origin single-file mobile smoke
        if: ${{ always() }}
        run: |
          set -o pipefail
          npm run browser:smoke:mobile:offline 2>&1 | tee "$MOBILE_VALIDATION_ARTIFACT_DIR/logs/browser_smoke_mobile_offline.log"

      - name: Check whitespace and patch integrity
        if: ${{ always() }}
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee "$MOBILE_VALIDATION_ARTIFACT_DIR/logs/git_diff_check.log"

      - name: Capture generated validation outputs
        if: always()
        run: |
          mkdir -p "$MOBILE_VALIDATION_ARTIFACT_DIR/generated"
          if [ -d dist ]; then cp -a dist "$MOBILE_VALIDATION_ARTIFACT_DIR/generated/"; fi
          if [ -f SOURCE_MANIFEST.json ]; then cp SOURCE_MANIFEST.json "$MOBILE_VALIDATION_ARTIFACT_DIR/generated/"; fi
          if [ -d .agent-validation/mobile-offline-release-smoke ]; then
            cp -a .agent-validation/mobile-offline-release-smoke "$MOBILE_VALIDATION_ARTIFACT_DIR/generated/"
          fi
          git status --short --branch > "$MOBILE_VALIDATION_ARTIFACT_DIR/logs/final_git_status.txt"

      - name: Upload mobile validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vaw-mobile-touch-validation-${{ github.sha }}
          path: /tmp/vaw-mobile-validation
          if-no-files-found: error
          retention-days: 14
