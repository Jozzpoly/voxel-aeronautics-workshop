name: Mobile Touch Validation

on:
  push:
    branches:
      - mobile/touch-foundation
  pull_request:
    branches:
      - VAW_GRoK
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-smoke-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        variant:
          - evaluate-barrier
          - evaluate-barrier-stable-point

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch diagnostic smoke copy
        env:
          DIAGNOSTIC_VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('tests/run_mobile_browser_smoke.mjs')
          source = path.read_text(encoding='utf-8')
          old_touch = """async function touch(cdp, type, touchPoints) {
            await cdp.call('Input.dispatchTouchEvent', {
              type,
              touchPoints,
              modifiers: 0
            });
          }
          """
          new_touch = """async function touch(cdp, type, touchPoints) {
            await cdp.call('Input.dispatchTouchEvent', {
              type,
              touchPoints,
              modifiers: 0
            });
            await evaluate(cdp, 'true');
          }
          """
          if source.count(old_touch) != 1:
              raise SystemExit('Expected mobile touch helper was not found exactly once.')
          source = source.replace(old_touch, new_touch)

          if os.environ['DIAGNOSTIC_VARIANT'] == 'evaluate-barrier-stable-point':
              old_candidates = """    const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
              const candidates = [center];
          """
              new_candidates = """    const candidates = [];
          """
              if source.count(old_candidates) != 1:
                  raise SystemExit('Expected center-first canvas candidate block was not found exactly once.')
              source = source.replace(old_candidates, new_candidates)

          path.write_text(source, encoding='utf-8', newline='\n')
          PY

      - name: Run mobile smoke diagnostic
        run: |
          set -o pipefail
          mkdir -p /tmp/vaw-mobile-smoke-diagnostic
          npm run browser:smoke:mobile 2>&1 | tee /tmp/vaw-mobile-smoke-diagnostic/result.log

      - name: Upload mobile smoke diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vaw-mobile-smoke-${{ matrix.variant }}-${{ github.sha }}
          path: /tmp/vaw-mobile-smoke-diagnostic
          if-no-files-found: error
          retention-days: 7
