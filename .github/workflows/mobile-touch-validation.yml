name: Mobile Touch Validation

on:
  push:
    branches:
      - mobile/touch-foundation
  pull_request:
    branches:
      - VAW_GRoK
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-smoke-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check deterministic mobile smoke candidate
        run: node --check tests/run_mobile_browser_smoke_candidate.mjs

      - name: Run deterministic mobile smoke candidate
        run: |
          set -o pipefail
          mkdir -p /tmp/vaw-mobile-smoke-candidate
          node tests/run_mobile_browser_smoke_candidate.mjs 2>&1 | tee /tmp/vaw-mobile-smoke-candidate/result.log

      - name: Upload deterministic mobile smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vaw-mobile-smoke-candidate-${{ github.sha }}
          path: /tmp/vaw-mobile-smoke-candidate
          if-no-files-found: error
          retention-days: 7
