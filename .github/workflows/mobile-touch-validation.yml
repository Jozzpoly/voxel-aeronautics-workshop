name: Mobile Touch Validation

on:
  push:
    branches:
      - mobile/touch-foundation
  pull_request:
    branches:
      - VAW_GRoK
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout mobile branch
        uses: actions/checkout@v4
        with:
          ref: mobile/touch-foundation

      - name: Promote validated smoke and remove diagnostics
        run: |
          cp tests/run_mobile_browser_smoke_candidate.mjs tests/run_mobile_browser_smoke.mjs
          rm tests/run_mobile_browser_smoke_candidate.mjs
          rm tests/run_mobile_pointer_probe.mjs
          node --check tests/run_mobile_browser_smoke.mjs

      - name: Commit canonical mobile smoke
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/run_mobile_browser_smoke.mjs tests/run_mobile_browser_smoke_candidate.mjs tests/run_mobile_pointer_probe.mjs
          git commit -m "Promote deterministic mobile browser smoke"
          git push origin HEAD:mobile/touch-foundation
