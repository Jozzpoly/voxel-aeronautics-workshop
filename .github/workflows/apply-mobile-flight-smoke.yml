name: Apply Mobile Flight Smoke

on:
  push:
    branches:
      - mobile/playable-mvp
  pull_request:
    branches:
      - VAW_GRoK
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-mobile-flight-smoke
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[flight smoke published]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/playable-mvp

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply native flight smoke patch
        run: python tools/apply_mobile_flight_smoke_patch.py

      - name: Validate patched smoke syntax and flight units
        run: |
          node --check tests/run_mobile_browser_smoke.mjs
          node tests/test_mobile_command_port.js
          node tests/test_mobile_flight_controls.js
          python tests/test_mobile_playable_architecture.py

      - name: Remove one-time patch script
        run: rm tools/apply_mobile_flight_smoke_patch.py

      - name: Commit validated smoke patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/run_mobile_browser_smoke.mjs tools/apply_mobile_flight_smoke_patch.py
          git commit -m "Validate native mobile flight controls [flight smoke published]"

      - name: Publish review branch
        run: git push --force origin HEAD:refs/heads/automation/mobile-flight-smoke
