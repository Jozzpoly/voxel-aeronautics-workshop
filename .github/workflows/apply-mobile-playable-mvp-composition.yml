name: Apply Mobile Playable MVP Composition

on:
  push:
    branches:
      - mobile/playable-mvp

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[mobile composition applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/playable-mvp

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply composition patch
        run: python tools/apply_mobile_playable_mvp_composition.py

      - name: Validate patched composition
        run: |
          node --check src/game.js
          node tests/test_mobile_command_port.js
          python tests/test_mobile_release_wiring.py

      - name: Remove one-time patch machinery
        run: |
          rm tools/apply_mobile_playable_mvp_composition.py
          rm .github/workflows/apply-mobile-playable-mvp-composition.yml

      - name: Commit patched composition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game.js tools/apply_mobile_playable_mvp_composition.py .github/workflows/apply-mobile-playable-mvp-composition.yml
          git commit -m "Wire explicit mobile gameplay command port [mobile composition applied]"
          git push origin HEAD:mobile/playable-mvp
