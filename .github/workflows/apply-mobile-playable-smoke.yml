name: Apply Mobile Playable Smoke Extension

on:
  push:
    branches:
      - mobile/playable-mvp

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[playable smoke applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/playable-mvp

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extend canonical mobile browser smoke
        run: python tools/apply_mobile_playable_smoke_patch.py

      - name: Validate extended smoke syntax and focused units
        run: |
          node --check tests/run_mobile_browser_smoke.mjs
          node tests/test_mobile_playable_shell.js
          node tests/test_mobile_camera_autobind.js
          python tests/test_mobile_release_wiring.py

      - name: Remove one-time patch machinery
        run: |
          rm tools/apply_mobile_playable_smoke_patch.py
          rm .github/workflows/apply-mobile-playable-smoke.yml

      - name: Commit extended smoke
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/run_mobile_browser_smoke.mjs tools/apply_mobile_playable_smoke_patch.py .github/workflows/apply-mobile-playable-smoke.yml
          git commit -m "Validate playable mobile build loop [playable smoke applied]"
          git push origin HEAD:mobile/playable-mvp
