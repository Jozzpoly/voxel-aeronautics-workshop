name: Fix Mobile Playable Smoke Carousel

on:
  push:
    branches:
      - mobile/playable-mvp

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[carousel fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/playable-mvp

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply carousel visibility fix
        run: python tools/fix_mobile_playable_smoke_carousel.py

      - name: Validate smoke syntax
        run: node --check tests/run_mobile_browser_smoke.mjs

      - name: Remove one-time fix machinery
        run: |
          rm tools/fix_mobile_playable_smoke_carousel.py
          rm .github/workflows/fix-mobile-playable-smoke-carousel.yml

      - name: Commit carousel visibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/run_mobile_browser_smoke.mjs tools/fix_mobile_playable_smoke_carousel.py .github/workflows/fix-mobile-playable-smoke-carousel.yml
          git commit -m "Scroll mobile shell controls into touch view [carousel fixed]"
          git push origin HEAD:mobile/playable-mvp
