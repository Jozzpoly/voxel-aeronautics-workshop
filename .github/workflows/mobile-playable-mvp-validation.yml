name: Mobile Playable MVP Validation

on:
  push:
    branches:
      - mobile/playable-mvp
      - mobile/compatibility-validation
  pull_request:
    branches:
      - mobile/playable-mvp
      - VAW_GRoK
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-playable-mvp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vertical-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYABLE_SMOKE_DIR: /tmp/vaw-mobile-playable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate explicit mobile command boundary
        run: |
          node --check src/game/mobile-command-port.js
          node --check src/game/mobile-game-command-adapter.js
          node --check src/game/mobile-playable-shell.js
          node --check src/game/mobile-flight-controls.js
          node --check src/game.js
          node tests/test_mobile_command_port.js
          node tests/test_mobile_game_command_adapter.js
          node tests/test_mobile_playable_shell.js
          node tests/test_mobile_flight_controls.js
          python tests/test_mobile_command_composition.py
          python tests/test_mobile_playable_architecture.py
          python tests/test_mobile_release_wiring.py
          python tests/test_game_architecture.py

      - name: Revalidate retained touch camera foundation
        run: |
          node tests/test_mobile_device_profile.js
          node tests/test_mobile_runtime_shell.js
          node tests/test_mobile_touch_controller.js
          node tests/test_mobile_pointer_adapter.js
          node tests/test_mobile_camera_gesture_bridge.js
          node tests/test_mobile_camera_input_runtime.js
          node tests/test_mobile_camera_autobind.js

      - name: Run mobile browser smoke
        run: |
          mkdir -p "$PLAYABLE_SMOKE_DIR"
          combined="$PLAYABLE_SMOKE_DIR/mobile-playable-smoke.log"
          : > "$combined"
          for attempt in 1 2 3; do
            attempt_log="$PLAYABLE_SMOKE_DIR/mobile-playable-smoke-attempt-${attempt}.log"
            set +e
            npm run browser:smoke:mobile 2>&1 | tee "$attempt_log"
            code=${PIPESTATUS[0]}
            set -e
            {
              echo "=== focused mobile smoke attempt ${attempt}, exit ${code} ==="
              cat "$attempt_log"
            } >> "$combined"
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if [ "$code" -ne 2 ]; then
              exit "$code"
            fi
            echo "Mobile smoke reported an environment failure; retrying." | tee -a "$combined"
            sleep $((attempt * 2))
          done
          exit 2

      - name: Run no-origin single-file mobile smoke
        if: ${{ always() }}
        run: |
          set -o pipefail
          mkdir -p "$PLAYABLE_SMOKE_DIR"
          npm run browser:smoke:mobile:offline 2>&1 | tee "$PLAYABLE_SMOKE_DIR/mobile-offline-release-smoke.log"

      - name: Check patch integrity
        if: ${{ always() }}
        run: git diff --check

      - name: Upload playable smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-playable-smoke-${{ github.sha }}
          path: /tmp/vaw-mobile-playable
          if-no-files-found: warn
          retention-days: 14
