name: Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile Python
        run: python -m compileall .

      - name: Run core validation
        run: python -u tests/run_all.py

      - name: Build deterministic release
        run: python tools/build_release.py

      - name: Verify release
        run: python tools/verify_release.py --single dist/Voxel_Aeronautics_Workshop_Workbench_Foundation.html --zip dist/Voxel_Aeronautics_Workshop_Workbench_Foundation.zip --hashes dist/SHA256.txt

      - name: Check whitespace
        run: git diff --check
