name: Generate Mobile Flight Provenance

on:
  push:
    branches:
      - mobile/playable-mvp
  pull_request:
    branches:
      - VAW_GRoK
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-mobile-flight-provenance
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/playable-mvp

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install exact Tailwind regeneration dependency
        run: npm install --no-save --package-lock=false --ignore-scripts tailwindcss@4.1.10

      - name: Regenerate official artifacts
        run: |
          node tools/generate_tailwind_css.js
          python tools/build_release.py

      - name: Verify generated mutation scope
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' SOURCE_MANIFEST.json tailwind.generated.css | sort)"
          printf 'Changed files:\n%s\n' "$changed"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected generated-file scope." >&2
            exit 1
          fi

      - name: Commit generated provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE_MANIFEST.json tailwind.generated.css
          git commit -m "Regenerate mobile flight-control provenance [flight provenance published]"

      - name: Publish provenance review branch
        run: git push --force origin HEAD:refs/heads/automation/mobile-flight-provenance
